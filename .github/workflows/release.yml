name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Check for unpublished package versions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      due: ${{ steps.unpublished.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: List package versions missing from npm
        id: unpublished
        run: |
          unpublished="$(node scripts/list-unpublished-packages.mjs)"
          if [ -z "$unpublished" ]; then
            echo "::notice title=Release skipped::Every package version is already on npm."
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$unpublished"
          echo "due=true" >> "$GITHUB_OUTPUT"

  ci:
    name: Wait for CI on this commit
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Require every CI workflow to pass for this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-release-ci.mjs

  publish:
    name: Publish packages
    needs: [plan, ci]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.due == 'true'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject runs from other refs
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::Releases publish only from main."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: node scripts/build-libraries.mjs
      - name: Configure the git identity for release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish changed packages with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=NPM_TOKEN is missing::A publish is due, but NPM_TOKEN is not configured."
            exit 1
          fi
          bun run release:skip-build
      - name: Push the release tags, including after a partial publish failure
        if: always()
        run: git push origin --tags
