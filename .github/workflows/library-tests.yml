name: Library tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libraries:
    name: Library tests / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.18.0
          - 24
          - 26
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Cache npm downloads for the pinned package managers
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/npm-cache
          key: npm-${{ runner.os }}-pnpm@10.34.7-yarn@1.22.22
      - name: Install pinned package managers
        working-directory: ${{ runner.temp }}
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm install --global --prefer-offline pnpm@10.34.7 yarn@1.22.22
      - name: Verify package managers
        working-directory: ${{ runner.temp }}
        run: |
          npm --version
          pnpm --version
          yarn --version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/build-libraries.mjs
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun x playwright install --with-deps chromium
      - name: Install Redis for isolated socket and cluster behavior tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Load MySQL time zone tables for named-zone tests
        run: |
          container=$(docker ps --filter "ancestor=mysql:8.0" --format '{{.ID}}' | head -n 1)
          test -n "$container"
          if [ "$(docker exec "$container" mysql -uroot -N -B -e "SELECT COUNT(*) FROM mysql.time_zone_name" mysql)" = "0" ]; then
            docker exec "$container" sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | sed 's/Local time zone must be set--see zic manual page/FCTY/' | mysql -uroot mysql"
          fi
          test "$(docker exec "$container" mysql -uroot -N -B -e "SELECT CONVERT_TZ('2000-01-01 00:00:00', 'UTC', 'Asia/Tokyo')" mysql)" = "2000-01-01 09:00:00"
      - name: Run every library package against real services
        run: bun run test:libraries
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: library-test-logs-node-${{ matrix.node }}
          path: coverage/native-libraries/
