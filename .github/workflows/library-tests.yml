name: Library tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libraries:
    name: Library tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install pinned package managers
        working-directory: ${{ runner.temp }}
        run: npm install --global pnpm@10.34.7 yarn@1.22.22
      - name: Verify package managers
        working-directory: ${{ runner.temp }}
        run: |
          npm --version
          pnpm --version
          yarn --version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/build-libraries.mjs
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun x playwright install --with-deps chromium
      - name: Install Redis for isolated socket and cluster behavior tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Run every library package against real services
        run: bun run test:libraries
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: library-test-logs
          path: coverage/native-libraries/
