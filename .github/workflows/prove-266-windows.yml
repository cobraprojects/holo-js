name: PROVE-266 Windows concurrent writer loop

on:
  pull_request:
  push:
    branches:
      - ticket/266-windows-orphaned-lease

permissions:
  contents: read

jobs:
  loop:
    name: windows-latest / Node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.14.0
          - 24
          - 26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/build-libraries.mjs
      - name: Run the concurrent-writer test 30 times in a row
        working-directory: packages/session
        run: |
          for i in $(seq 1 30); do
            if node ../../node_modules/vitest/vitest.mjs --run tests/file-lock.test.ts -t "concurrent writer" --pool forks --maxWorkers 1 --reporter=verbose > /tmp/run-$i.log 2>&1; then
              echo "run $i green: $(sed 's/\x1b\[[0-9;]*m//g' /tmp/run-$i.log | grep -aoE 'lease=(false|true) +[0-9]+ms' | tr '\n' ' ')"
            else
              echo "run $i RED"
              sed 's/\x1b\[[0-9;]*m//g' /tmp/run-$i.log | tail -80
              exit 1
            fi
          done
          echo "30 of 30 consecutive runs green"
