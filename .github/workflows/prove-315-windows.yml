name: PROVE-315 Windows native session locking loop

on:
  workflow_dispatch:
  push:
    branches:
      - ticket/315-windows-session-lock

permissions:
  contents: read

jobs:
  loop:
    name: windows-latest / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.14.0
          - 24
          - 26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/build-libraries.mjs
      - name: Run the native session locking suite 30 times with lock tracing
        working-directory: packages/session
        run: |
          set +e +o pipefail
          mkdir -p ../../lock-traces
          : > ../../lock-traces/summary.txt
          for i in $(seq 1 60); do
            mkdir -p "../../lock-traces/run-$i"
            HOLO_SESSION_LOCK_TRACE_DIR="../../lock-traces/run-$i" bun run test:platform > "../../lock-traces/run-$i/result.json" 2> "../../lock-traces/run-$i/stderr.log"
            code=$?
            failed=$(grep -o -E '"fullName":"[^"]*","status":"failed"' "../../lock-traces/run-$i/result.json" | sed 's/,"status":"failed"//' | tr '\n' ' ')
            echo "run $i exit=$code failed=[$failed]" | tee -a ../../lock-traces/summary.txt
          done
          echo "--- runs with a failure:" | tee -a ../../lock-traces/summary.txt
          grep -v "exit=0 failed=\[\]" ../../lock-traces/summary.txt || true
      - name: Upload lock traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-traces-node-${{ matrix.node }}
          path: lock-traces
          retention-days: 7
