name: Node platform compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-server-lifecycle:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22.14.0
          - 24
          - 26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install pinned package managers
        working-directory: ${{ runner.temp }}
        run: npm install --global pnpm@10.34.7 yarn@1.22.22
      - name: Verify package managers
        working-directory: ${{ runner.temp }}
        run: |
          npm --version
          pnpm --version
          yarn --version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/build-libraries.mjs
      - name: Test native file session locking
        working-directory: packages/session
        continue-on-error: true # H98-DEBUG
        env:
          H98_TIMING: '1' # H98-DEBUG
        run: bun run test:platform
      # H98-DEBUG-START (temporary experiments; remove before the fix lands)
      - name: H98 sequential platform files
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: packages/session
        env:
          H98_TIMING: '1'
        run: node ../../node_modules/vitest/vitest.mjs --run tests/file-lock.test.ts tests/file-lock-busy.test.ts tests/file-lock-handover.test.ts tests/file-lock-released.test.ts tests/file-lock-young-release.test.ts --pool forks --maxWorkers 1 --reporter=json
      - name: H98 handover alone
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: packages/session
        run: node ../../node_modules/vitest/vitest.mjs --run tests/file-lock-handover.test.ts --pool forks --reporter=json
      - name: H98 young-release alone
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: packages/session
        env:
          H98_TIMING: '1'
        run: node ../../node_modules/vitest/vitest.mjs --run tests/file-lock-young-release.test.ts --pool forks --reporter=json
      - name: H98 others in parallel without young-release
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: packages/session
        run: node ../../node_modules/vitest/vitest.mjs --run tests/file-lock.test.ts tests/file-lock-busy.test.ts tests/file-lock-handover.test.ts tests/file-lock-released.test.ts --pool forks --reporter=json
      # H98-DEBUG-END
      - name: Test native package loading and server lifecycle
        working-directory: packages/cli
        run: bun run test:platform
      - name: Test local storage path validation
        working-directory: packages/storage
        run: node ../../node_modules/vitest/vitest.mjs --run tests/local-path.test.ts --fileParallelism --maxWorkers 2 --reporter=json
