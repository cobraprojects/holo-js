name: Scaffold smoke against the live npm registry

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-registry-scaffold:
    name: Scaffold smoke (live npm registry)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOLO_SCAFFOLD_SMOKE_LIVE_REGISTRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Scaffold, install, build, and serve each framework with the newest published dependencies
        run: node scripts/validate-scaffold-user-journey-smoke.mjs
