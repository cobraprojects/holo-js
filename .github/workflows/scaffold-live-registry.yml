name: Acceptance checks against the live npm registry

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-registry-scaffold:
    name: Acceptance checks (live npm registry)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HOLO_SCAFFOLD_SMOKE_LIVE_REGISTRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Cache Bun downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chromium for the browser checks
        run: bun x playwright install --with-deps chromium
      - name: Scaffold, install, build, and serve each framework with the newest published dependencies
        run: node scripts/validate-scaffold-user-journey-smoke.mjs
      - name: Build and serve the browser bundle consumer with the newest published dependencies
        if: ${{ !cancelled() }}
        run: node scripts/validate-browser-bundle.mjs
      - name: Upgrade the newest published release to this commit with npm and Bun
        if: ${{ !cancelled() }}
        run: bun run test:package-upgrade
